llm:
  provider: "openai-compatible"
  base_url: "http://10.67.43.7:12345/v1"
  endpoint: ""
  api_key: "sk-1234"
  model: "qwen3"
  temperature: 0.2
  max_tokens: 4096
  timeout: 300
  top_p: 0.5
  presence_penalty: 1.5
  top_k: 1
  enable_thinking: false
  response_format_json: false

paths:
  cases: "../../RUNTIME/raw_data/格式化案例库/uniknow-full-text.json"
  dialogues: "../../RUNTIME/raw_data/格式化对话记录/用户和坐席交互09-proceed-full.json"
  output_dir: "outputs"

case_fields:
  case_id: "__key__"
  title: "case_name"
  phenomenon: "text"
  solution: "text"

dialogue_fields:
  dialogue_id: "__key__"
  case_id: "caseId"
  final_case_id: "final_case_id"
  resolved: "resolved"
  turns: "text"
  speaker: "speaker"
  text: "text"

retrieval:
  candidate_top_n: 50
  per_route_top_n: 12
  related_top_k: 5
  rerank_top_n: 20
  minimum_score: 0.35
  fallback_min_cases: 2
  bm25_weight: 0.6
  semantic_weight: 0.4

assistant:
  # manual: type assistant replies in terminal.
  # api: call the real enterprise assistant pipeline.
  mode: "manual"
  base_url: "http://10.67.43.6:8338"
  policy_base_url: "http://10.67.43.14:8338"
  response_base_url: "http://10.67.43.14:8338"
  timeout: 120
  query_path: "/query"
  trigger_path: "/trigger"
  policy_path: "/policy"
  response_path: "/response"
  allow_missing_policy: true
  missing_policy_value: ""
