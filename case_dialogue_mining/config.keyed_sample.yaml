paths:
  cases: "data/keyed_sample/cases.json"
  dialogues: "data/keyed_sample/dialogues.json"
  output_dir: "outputs_keyed_sample"

case_fields:
  case_id: "__key__"
  title: "case_name"
  phenomenon: "text"
  solution: "text"

dialogue_fields:
  dialogue_id: "__key__"
  case_id: "caseId"
  turns: "text"
  role: "role"
  text: "text"
  metadata_case_id_paths:
    - "caseId"

analysis:
  max_cases: 0
  max_dialogues_per_case: 5
  max_turns_per_dialogue: 12
  max_chars_per_dialogue: 3000

local_ai:
  provider: "mock"
  endpoint: "http://localhost:8000/v1/chat/completions"
  model: "local-model-name"
  api_key_env: "LOCAL_AI_API_KEY"
  temperature: 0.2
  max_tokens: 2048
  timeout: 60
