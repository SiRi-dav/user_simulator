paths:
  cases: "../../RUNTIME/raw_data/格式化案例库/uniknow-full-text.json"
  dialogues: "../../RUNTIME/raw_data/格式化对话记录/用户和坐席交互09-proceed-full.json"
  output_dir: "outputs"

case_fields:
  case_id: "__key__"
  title: "case_name"
  phenomenon: "text"
  solution: "text"

dialogue_fields:
  dialogue_id: "__key__"
  case_id: "caseId"
  turns: "text"
  role: "role"
  text: "text"
  metadata_case_id_paths:
    - "resolution.case_id"
    - "metadata.case_id"
    - "final_case_id"
    - "caseId"

analysis:
  max_cases: 100
  max_dialogues_per_case: 5
  max_turns_per_dialogue: 12
  max_chars_per_dialogue: 3000

local_ai:
  provider: "openai-compatible"
  endpoint: "http://localhost:8850/v1/chat/completions"
  model: "qwen3-32b"
  api_key_env: "LOCAL_AI_API_KEY"
  temperature: 0.3
  max_tokens: 2048
  timeout: 60
  top_p: 0.5
  presence_penalty: 1.5
  top_k: 1
  enable_thinking: false
