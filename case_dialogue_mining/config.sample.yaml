paths:
  cases: "data/sample_cases.jsonl"
  dialogues: "data/sample_dialogues.jsonl"
  output_dir: "outputs_sample"

case_fields:
  case_id: "case_id"
  title: "title"
  phenomenon: "phenomenon"
  solution: "solution"

dialogue_fields:
  dialogue_id: "dialogue_id"
  case_id: "case_id"
  turns: "turns"
  role: "role"
  text: "text"
  metadata_case_id_paths:
    - "resolution.case_id"
    - "metadata.case_id"
    - "final_case_id"

analysis:
  max_cases: 0
  max_dialogues_per_case: 5
  max_turns_per_dialogue: 12
  max_chars_per_dialogue: 3000

local_ai:
  provider: "mock"
  endpoint: "http://localhost:8000/v1/chat/completions"
  model: "local-model-name"
  api_key_env: "LOCAL_AI_API_KEY"
  temperature: 0.2
  max_tokens: 2048
  timeout: 60
